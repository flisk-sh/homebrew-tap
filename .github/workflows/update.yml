name: Update and test the formula

# Each release of flisk-sh/releases is picked up here, tested on every
# platform, and only then pushed. No token from another repository is needed.
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: update-formula-${{ github.ref }}
  cancel-in-progress: false

jobs:
  candidate:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.write.outputs.changed }}
      version: ${{ steps.write.outputs.version }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Write the formula for the latest release
        id: write
        run: |
          version="$(bash scripts/update-formula.sh)"
          echo "version=$version" >>"$GITHUB_OUTPUT"
          if git diff --quiet -- Formula/flisk.rb; then
            echo "changed=false" >>"$GITHUB_OUTPUT"
          else
            echo "changed=true" >>"$GITHUB_OUTPUT"
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: formula
          path: Formula/flisk.rb
          if-no-files-found: error

  test:
    needs: candidate
    if: needs.candidate.outputs.changed == 'true' || github.event_name != 'schedule'
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, macos-15-intel, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_ANALYTICS: "1"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: formula
          path: Formula
      - name: Put Homebrew on the path
        if: runner.os == 'Linux'
        run: echo "/home/linuxbrew/.linuxbrew/bin" >>"$GITHUB_PATH"
      - name: Tap this checkout
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/flisk.rb
          git commit -m "candidate" --allow-empty
          brew tap flisk-sh/tap "$GITHUB_WORKSPACE"
      - name: Install
        run: brew install flisk-sh/tap/flisk
      - name: Test
        run: brew test flisk-sh/tap/flisk
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - name: Run the installed CLI and find its engine
        shell: bash
        env:
          VERSION: ${{ needs.candidate.outputs.version }}
        run: |
          flisk --version | grep -F "$VERSION"
          cd "$(mktemp -d)"
          flisk project --yes --quiet
          # Copied from flisk-cli, which the binary finds next to its own path.
          test -f shared-platform-engineering/docker-templates/install-deps.sh

  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - run: node --test scripts/check-publish-workflow.test.mjs
      - run: node scripts/check-publish-workflow.mjs

  publish:
    needs: [candidate, test]
    if: needs.candidate.outputs.changed == 'true' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: formula
          path: Formula
      - name: Open a PR for the tested formula and merge it after GEL
        env:
          VERSION: ${{ needs.candidate.outputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          branch="bot/flisk-$VERSION"
          git checkout -B "$branch"
          git add Formula/flisk.rb
          git commit -s -m "flisk $VERSION"
          git push --force origin "$branch"
          body="Tested formula update for flisk $VERSION. The candidate was installed and tested on macOS (arm64 and Intel) and Linux before this PR was opened."
          if gh pr view "$branch" --json number >/dev/null 2>&1; then
            gh pr edit "$branch" --title "flisk $VERSION" --body "$body"
          else
            gh pr create --base main --head "$branch" --title "flisk $VERSION" --body "$body"
          fi
          # A direct push to main cannot carry the required GEL check; wait for the PR's checks first.
          if ! gh pr merge "$branch" --auto --squash; then
            gh pr checks "$branch" --watch --fail-fast --interval 30
            gh pr merge "$branch" --squash --delete-branch
          fi
